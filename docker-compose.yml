

services:
  mantis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mantis_backend
    ports:
      - "3000:3000"
      - "3001:3001"
      - "8080:8080"
    environment:
      - MANTIS_PORT=3000
      - MANTIS_WS_PORT=3001
      - MANTIS_LOG_LEVEL=info
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - mantis_logs:/app/logs

  prometheus:
    image: prom/prometheus:latest
    container_name: mantis_prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: mantis_grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana_data:
  mantis_logs:
