service: mantis-api

provider:
  name: aws
  region: us-east-1
  environment:
    LOGS_TABLE: ${self:custom.logsTableName}
    BLOCKLIST_TABLE: ${self:custom.blocklistTableName}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
          Resource:
            - "arn:aws:dynamodb:${aws:region}:*:table/${self:custom.logsTableName}"
            - "arn:aws:dynamodb:${aws:region}:*:table/${self:custom.blocklistTableName}"

custom:
  logsTableName: mantis-logs-${sls:stage}
  blocklistTableName: mantis-blocklist-${sls:stage}

package:
  individually: true

functions:
  api:
    runtime: nodejs20.x
    handler: src/server/lambda.handler
    events:
      - httpApi: '*'
    package:
      patterns:
        - '!**/*'
        - 'src/server/**'
        - 'package.json'
        - 'node_modules/**'
  
  engine:
    runtime: python3.11
    handler: src/engine/handler.lambda_handler
    events:
      - schedule: rate(5 minutes)
    package:
      patterns:
        - '!**/*'
        - 'src/engine/**'
        - 'requirements.txt'

resources:
  Resources:
    MantisLogsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.logsTableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: request_id
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: N
        KeySchema:
          - AttributeName: request_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: TimestampIndex
            KeySchema:
              - AttributeName: request_id
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    MantisBlocklistTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.blocklistTableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: ip
            AttributeType: S
        KeySchema:
          - AttributeName: ip
            KeyType: HASH
